[package]
name = "prometheus_web_exporter"
version = "1.0.8"
authors = ["Huseyin Yilmaz <yilmazhuseyin@gmail.com>"]
edition = "2018"
description = "Web exporter for prometheus"
repository = "https://github.com/huseyinyilmaz/web_exporter"
readme = "README.md"
license-file = "LICENSE"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
warp = {version = "0.4.1", features = ["compression", "server"]}
reqwest = {version = "0.12.23", default-features = false, features = ["rustls-tls", "json", "multipart"]} # remove openssl dependency from reqwest.
log = "0.4"
pretty_env_logger = "0.5"
scraper = "0.23.1"
config = "0.15.14"
serde = { version = "1.0.106", features = ["derive"] }
serde_yaml = "0.9"
futures = "0.3.4"
